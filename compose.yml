services:
  verdaccio-supply-chain:
    build: .
    image: local/verdaccio-supply-chain:1.0.0
    container_name: verdaccio-supply-chain
    restart: unless-stopped
    environment:
      # A pypi source is a nexus repository url, it is read through the REST API.
      SCAN_ROOTS: "${SCAN_ROOTS:-/verdaccio-data:npm, http://10.17.1.201:24873/repository/pypi-group:PyPI}"
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-}
      PYPI_REGISTRY_URL: ${PYPI_REGISTRY_URL:-http://10.17.1.201:24873/repository/pypi-group}
      REPORT_DIR: /reports
      SCAN_INTERVAL_HOURS: "24"
      SCAN_ON_START: "true"
      OSV_ENABLED: "true"
      OSV_API_URL: ${OSV_API_URL:-https://api.osv.dev/v1/querybatch}
      OSV_BATCH_SIZE: "1000"
      OSV_TIMEOUT_SECONDS: "15"
      OSV_RETRIES: "1"
      OSV_TIME_BUDGET_SECONDS: "3600"
      OSV_ENRICH: ${OSV_ENRICH:-true}
      OSV_ENRICH_MAX: "5000"
      OSV_ENRICH_WORKERS: "8"
      OSV_DETAIL_TIMEOUT_SECONDS: "15"
      MAX_TARBALL_MB: "2048"
      REPORT_HTTP_BIND: "0.0.0.0"
      REPORT_HTTP_PORT: "8080"
      REPORT_TOKEN: ${REPORT_TOKEN:-}
      # API key for marking a finding as reviewed on the risk pages.
      REVIEW_API_KEY: ${REVIEW_API_KEY:-123456}
      SCAN_RETRY_AFTER_SECONDS: "10"
      NTFY_ENABLED: "true"
      NTFY_URL: ${NTFY_URL:-https://msn.feg.cn}
      NTFY_TOPIC: ${NTFY_TOPIC:-pub_abc}
      NTFY_ALERT_MODE: ${NTFY_ALERT_MODE:-always}
      NTFY_SCOPE: ${NTFY_SCOPE:-relevant}
      NTFY_TIMEOUT_SECONDS: "10"
      NTFY_RETRIES: "2"
      NTFY_MAX_MESSAGE_BYTES: "3500"
      NTFY_MAX_ITEMS: "20"
      REPORT_PUBLIC_URL: ${REPORT_PUBLIC_URL:-}
      REPORT_PAGE_SIZE: "100"
      REPORT_STATIC_HTML_MAX: "50000"
      REPORT_ARCHIVE_KEEP: "2"
      LOG_LEVEL: INFO
      TZ: Asia/Taipei
    ports:
      - "${REPORT_HTTP_PORT:-8080}:8080"
    volumes:
      - ${VERDACCIO_DATA:-./verdaccio-data}:/verdaccio-data:ro
      - ./reports:/reports
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${SCAN_MEM_LIMIT:-4g}
    cpus: 2.0

